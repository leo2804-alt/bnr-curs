name: Update BNR
on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * *'   # 13:35 vara
    - cron: '35 11 * * *'   # 13:35 iarna
    - cron: '5 13 * * *'    # 16:05 vara (rezerva, in caz ca prima sare)
    - cron: '5 14 * * *'    # 16:05 iarna (rezerva)
    - cron: '35 18 * * *'   # 21:35 vara — prinde si titlurile de seara
    - cron: '35 19 * * *'   # 21:35 iarna

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch BNR
        run: python update_bnr.py
      - name: Commit JSON
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add curs.json
          git commit -m "Update curs BNR" || echo "No changes"
          git push
